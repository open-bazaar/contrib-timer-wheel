name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.0'
      - name: Install locked dependencies
        run: uv sync --locked --prerelease allow
      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync pyright
      - name: Run real business tests
        run: uv run --no-sync python scripts/ci_pytest.py -vv -s -m 'not e2e and not system'
      - name: Run system tests
        run: uv run --no-sync python scripts/ci_pytest.py -vv -s -m system || test "$?" -eq 5
      - name: Build distributions
        run: uv run --python 3.15 --no-project scripts/release.py build
      - name: Verify isolated installations
        run: uv run --python 3.15 --no-project scripts/release.py verify
