[project]
name = "bazaar-contrib-timer-wheel"
version = "0.3.0rc9"
description = "Shared hierarchical timing wheel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "bazaar-contrib-timer~=0.3.0rc1", "pydantic>=2.12.0"]

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-timer-wheel"

[project.entry-points."bazaar_compute_node.contribs"]
timer-wheel = "bazaar_contrib_timer_wheel:timer_wheel"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "aiofiles>=25.1.0",
    "types-aiofiles>=25.1.0",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
